# Hermes config. Candidate facts live in profile/facts.md (the only source LLMs may use).
# Secrets never go here: Gmail App Password lives in output/hermes.env (chmod 600).

profile:
  name: Saral Banker
  email: saralbanker1@gmail.com
  phone: +91 9106990136
  location: Ahmedabad, Gujarat, India
  github: github.com/saralbanker
  portfolio: orvion-co.vercel.app
  linkedin: https://www.linkedin.com/in/saralbanker
  years_experience: 1
  education: Diploma in Computer Engineering, LJ Polytechnic (May 2026), CGPA 8.36/10,
    Top 10%
  work_authorization: India — authorized, no sponsorship needed
  willing_to_relocate: false
  available: Immediately

# Where the candidate can work: fully remote (hiring from India) OR on-site/hybrid
# within radius_km of home.
geo:
  home_name: Shahibaug, Ahmedabad
  home_lat: 23.0555
  home_lon: 72.5936
  radius_km: 20              # normal on-site/hybrid
  night_radius_km: 10        # night-shift on-site/hybrid

# Salary floors (owner, 2026-09-23). Jobs that publish pay below the floor are skipped;
# jobs without published pay are kept (most don't publish). Published pay raises rank.
salary:
  min_inr_per_month_india: 25000     # India / India-remote roles
  min_inr_per_month_global: 30000    # global remote roles (converted at usd_to_inr)
  target_inr_per_month: 100000       # long-term goal — used only for ranking
  usd_to_inr: 88

search:
  boards:
  - indeed
  - ats            # Greenhouse / Lever / Ashby public job-board APIs (see data/ats_companies.yaml)
  - wwr            # We Work Remotely category RSS feeds
  - arbeitnow      # Arbeitnow public remote engineering API with fast ATS resolution
  - himalayas
  - remotive
  - remoteok
  target_roles:
  - full stack engineer
  - software engineer
  - backend engineer
  - AI engineer
  - founding engineer
  - AI application developer
  - TypeScript engineer
  - python developer
  - node.js developer
  - LLM engineer
  location: Remote
  local_location: Ahmedabad, Gujarat
  country_indeed: India
  results_wanted: 40
  hours_old: 72
  max_job_age_days: 21       # older postings are marked expired, never applied to
  min_score: 6.5
  # Tiering: the candidate has ~1 year of paid experience and the screening answers report
  # 1 year, so asks of 5+ years are near-certain knockouts. Core = <=2 years asked and a
  # non-senior title; stretch = Senior/founding titles or 3-4 years asked (kept to a small
  # share of the daily budget). Seniority/stack/years judgement lives in src/qualify.py
  # (multi-evidence engine, see the `qualification:` block below).
  core_max_years: 2
  stretch_max_years: 4       # beyond this the gap is a near-certain knockout
  stretch_share: 0.15
  stretch_min_score: 7.5     # stretch applications need a stronger fit

# Multi-evidence qualification engine (src/qualify.py). Derived from profile/facts.md.
# No single non-decisive signal rejects: stack/seniority/constraint/role evidence from the
# title and the requirement/preferred/other description sections is combined.
qualification:
  core_stack: [typescript, javascript, python, golang, sql, node, node.js, nodejs, express.js,
    expressjs, react, reactjs, react.js, next.js, nextjs, fastapi, postgres, postgresql, redis,
    docker, llm, llms, rag, genai, generative ai, embeddings, mern, supabase, mysql, sqlite,
    rest api, restful, langchain, pgvector, vector database, prompt engineering, tailwind, vite]
  title_core_tokens: [go]     # only meaningful inside a title ("Go/Java"); too common in prose
  # Generic technologies that do not by themselves show the posting is in the candidate's stack
  # (e.g. "SQL Server" in a .NET job): ignored by the positive-evidence requirement.
  generic_stack: [sql, mysql, sqlite, redis, docker, rest api, restful]
  # Acceptable ONLY for intern/junior/trainee/fresher/entry/graduate titles or overall years <= 1.
  academic_stack: [java, kotlin, android]
  absent_stack: [.net, dotnet, asp.net, c#, php, laravel, wordpress, codeigniter, spring boot,
    spring framework, spring mvc, spring cloud, springboot, ruby on rails, ruby, salesforce,
    servicenow, sap, ios, swift, flutter, c++, embedded systems, embedded software,
    embedded engineer, firmware, mainframe, cobol,
    rust, solidity, smart contracts, uipath, rpa, automation anywhere, power apps, power platform,
    snowflake, databricks, spark, apache spark, dbt, airflow, power bi, unreal, unity, game engine,
    sfcc, salesforce commerce, oracle fsm, oracle erp, semiconductor, quantum, kernel, cuda,
    inference optimization, blockchain, web3]
  # Weak unless they are the role identity (DevOps/SRE/Cloud/Platform title) or "N years of X".
  platform_tokens: [aws, gcp, azure, google cloud, kubernetes, k8s, devops, sre, site reliability,
    terraform, ansible]
  # No production ML-model-training experience; neutralised when LLM-application work is named.
  ml_training_tokens: [machine learning engineer, ml engineer, data scientist, computer vision,
    deep learning, pytorch, tensorflow, model training, train models, training models,
    distillation, training optimization, pretraining, pre-training, fine-tuning, finetuning]
  # Role-type titles: the token IS the role wherever it appears in the title.
  role_identity_tokens: [devops, sre, site reliability, mlops, llmops, cloud engineer,
    cloud platform engineer, cloud developer, cloud architect, cloud infrastructure, infrastructure engineer, data engineer]
  # Title-only ML-training role tokens (role identity); neutralised only by LLM-app terms in the TITLE.
  ml_training_title_tokens: [data scientist, machine learning engineer, ml engineer, machine learning,
    computer vision, deep learning, research scientist]
  llm_app_tokens: [llm, llms, rag, genai, gen ai, generative ai, agent, agents, agentic, ai powered, ai-powered,
    ai application, ai applications, applied ai, ai engineer]
  junior_title_tokens: [intern, internship, junior, jr, associate, entry level, graduate,
    fresher, trainee, apprentice]
  languages: [english, hindi, gujarati]
  has_bachelor: false
  paid_years: 1
  knockout_years: 5          # "minimum/at least N years" with N >= this is decisive

scoring:
  min_similarity: 0.55       # embedding cosine floor (calibrated: relevant roles 0.60-0.70)
  max_llm_per_run: 250       # ~10 s each on CPU; the rest wait for the next run
  max_tailor_per_run: 60     # ~30 s per letter; tailor only what the apply stage can use

limits:
  linkedin_per_day: 0        # LinkedIn automation risks a permanent account ban
  other_per_day: 24          # 24 applications per day
  total_per_day: 24          # 24 applications per day (1 per hourly run)
  max_submits_per_run: 1     # 1 application per hourly run
  min_delay_seconds: 20
  max_delay_seconds: 45
  max_apply_minutes: 45      # per scheduled run; runs hourly

resumes:
  fullstack: resumes/resume-fullstack.pdf
  backend: resumes/resume-backend.pdf
  ai: resumes/resume-ai.pdf
  default: resumes/resume-fullstack.pdf

llm:
  base_url: http://localhost:11434
  model: qwen3:4b-instruct-2507-q4_K_M
  embed_model: nomic-embed-text
  timeout: 180
  keep_alive: 30m

notify:
  desktop: true              # notify-send on the laptop
  check_every_minutes: 10

screening_answers:
  years_experience_total: 1            # paid professional (freelance) years — numeric fields
  years_experience_text: About 1 year of paid freelance, client-facing work, and about 4 years of hands-on software development overall (projects and coursework).
  degree: Diploma in Computer Engineering
  currently_employed: 'No'
  current_ctc: Not currently employed (freelance)
  notice_period: Immediately available
  salary_expectation: Open to a competitive offer in line with the role's published range
  work_authorization: Yes, authorized to work in India
  work_authorization_short: 'Yes'
  requires_visa_sponsorship: 'No'
  willing_to_relocate: Open to fully remote positions
  ai_usage_statement: 'I build software with AI coding agents such as Claude Code. I write
    the specification and acceptance criteria, own the architecture, review every change,
    and verify it with tests and CI.'
  why_interested_template: 'I''m looking for a role with real ownership, where I can design
    and ship complete systems. I have built a 70k-line AI productivity platform with RAG, and AWIS, an event-sourced
    workflow engine in Go with 773 test functions. I''m available immediately and work well remotely.'

# Phase 3 (architect-redesign-docs): the new src/engine/ + src/engine_apply.py path,
# writing through claim/lease/fencing and the v2 schema (db/migrations/0001_opportunity_model.sql)
# instead of the legacy jobs-table status updates. MUST stay false until the new path has
# real-world verification (BROWSER_SYSTEM.md §116) — scripts/run_hermes.sh and every
# systemd unit call src/apply.py's main() directly and never read this flag, so flipping
# it here alone does not change what the scheduled/cron pipeline runs; it only unlocks
# src/engine_apply.py for a deliberate, explicitly-invoked call.
engine:
  enabled: false
  # Phase 6 (src/engine/gmail/): the new classify/correlate/notify pipeline.
  # MUST stay false until Telegram credentials exist and have been
  # reviewed — src/response_watcher.py + hermes-watch.timer never read this
  # flag and are the only thing actually polling real Gmail either way.
  gmail_enabled: false

# Phase 4 (architect-redesign-docs): the new src/engine/ai/ pipeline (AI_SYSTEM.md's
# frozen role architecture — embedding/reranker/scoring/generation). Independent, additive
# block — distinct from the legacy `llm:` block above, which src/llm.py/score.py/tailor.py
# keep reading unmodified. Model tags are an implementation choice (AI_SYSTEM.md §4: "the
# exact checkpoint is an implementation choice until benchmarked on the real host") —
# these are what Phase 4 measured on this host; see the Phase 4 report.
ai_roles:
  base_url: http://localhost:11434
  timeout: 180
  keep_alive: 30m
  roles:
    embedding: nomic-embed-text
    reranker: dengcao/bge-reranker-v2-m3
    scoring: phi4-mini
    generation: qwen3.5:4b-q4_K_M
