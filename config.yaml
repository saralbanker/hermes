# Local Ollama model — qwen3:4b fits in 4.4 GB available RAM (2.5 GB model size)
# Runs CPU-only on Ryzen 7 7730U — stable for 6-8 hr overnight sessions
ollama:
  base_url: "http://localhost:11434"
  model: "qwen3:4b"
  timeout: 300         # qwen3:4b on CPU: ~60-120s first token + generation
  keep_alive: "15m"   # keep model in RAM between jobs

# Keep legacy key for any code that still reads cfg["qwen"]
qwen:
  base_url: "http://localhost:11434"
  model: "qwen3:4b"
  timeout: 200

