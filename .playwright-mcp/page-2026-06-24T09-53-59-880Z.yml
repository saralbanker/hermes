            - generic [ref=e140]:
              - generic [ref=e141]:
                - text: We at Innovecture are hiring for a "Devops Engineer – Classic Legacy" to expand our team, this is a Remote position in India. You will work across various Innovecture and client teams and apply your technical expertise to some of the most complex and challenging technology problems.
                - text: "About Innovecture:"
                - text: Founded in 2007 under the leadership of CEO Shreyas Kamat, Innovecture LLC, began as a U.S.-based Information Technology and Management Consulting Company focusing on technology consulting and services. With international development centers located in Salt Lake City, USA, and Pune, India, Innovecture leverages its Global Agile Delivery Model to effectively deliver client projects within budget scope and project deadline. The primary focus of Innovecture is to provide a unique wealth of expertise and experience to the IT and Management Consulting realm by utilizing various technologies across multiple industry domains. Innovecture uses best-in-class design processes and top-quality talent to ensure the highest quality deliverables. With innovation embedded in its consulting and services approach, Innovecture will continue to deliver outstanding results for its Fortune 500 clients and employees.
              - generic [ref=e142]: Qualification
              - list [ref=e143]:
                - listitem [ref=e144]: 4+ years experience as a DevOps Engineer or equivalent software-engineering role
              - list [ref=e145]:
                - listitem [ref=e146]: Working knowledge of Groovy, PowerShell and known DevOps tools like Git and GitHub
              - list [ref=e147]:
                - listitem [ref=e148]: Possess a strong command of software-automation production systems (TFS & Jenkins)
              - list [ref=e149]:
                - listitem [ref=e150]: Good knowledge of NodeJS, Angular Builds, NPM, .Net and .Net Core
              - list [ref=e151]:
                - listitem [ref=e152]: Should have understanding of different transformation tools like MsDeploy, XPath transform, Json transform, etc.
              - list [ref=e153]:
                - listitem [ref=e154]: Excellent communication skills in English
              - list [ref=e155]:
                - listitem [ref=e156]: Ability to understand and work across diverse pipelines, from design to implementation using various technologies, and migrate applications between such pipelines
              - list [ref=e157]:
                - listitem [ref=e158]: Experience using Apigee or similar API management tools
              - list [ref=e159]:
                - listitem [ref=e160]: Experience in Infrastructure as Code (IaC) practices and tools
              - generic [ref=e161]: Responsibility
              - list [ref=e162]:
                - listitem [ref=e163]: Responsible to design build & deploy jobs using TFS release manager on Windows platform using PowerShell and Groovy
              - list [ref=e164]:
                - listitem [ref=e165]: Creating build jobs using MsBuild, Angular, NPM, etc.
              - list [ref=e166]:
                - listitem [ref=e167]: Implement automation tools and frameworks (CI/CD pipelines)
              - list [ref=e168]:
                - listitem [ref=e169]: Implementation static analysis tool using SonarQube and Puma
              - list [ref=e170]:
                - listitem [ref=e171]: Implementation of dynamic security scanning using OWASP ZAP or BlackDuck
              - list [ref=e172]:
                - listitem [ref=e173]: Troubleshoot production issues and coordinate with the development team to streamline code deployment
              - list [ref=e174]:
                - listitem [ref=e175]: Resolve or triage issues occurring during deployments such as IIS/ App Pool recycles, CPU/ disk space issues on servers, service alerts, etc.
              - list [ref=e176]:
                - listitem [ref=e177]: Collaborate with team members to improve the company’s engineering tools, systems and procedures, and data security
              - list [ref=e178]:
                - listitem [ref=e179]: Candidate must be flexible in terms of working hours due to the nature of the role
              - list [ref=e180]:
