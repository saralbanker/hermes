                        - generic [ref=f6e46]: "• Delivered a complete, documented, production-ready PostgreSQL-based financial system as a Rs.60,000 paid contract engagement, independently managing requirements through to client handoff; eliminated an estimated 40+ hours of manual billing and collection work per monthly cycle. Stack: React, Next.js, TypeScript, Node.js, PostgreSQL, Supabase, react-pdf, WhatsApp Business API PROJECTS Neuro-Zenith (NeuroDashboard) [70k+ LOC] 2025 – 2026 github.com/saralbanker/neuro-zenith · Role: Founder, Lead Architect, Lead Developer Independently designed and shipped a production-grade modular AI platform across a full-stack TypeScript monolith with an attached Python intelligence microservice — architected from first principles across 400+ source files, 115 directories, and 44 database migrations. • Core Modules: Knowledge Hub (AI knowledge management, semantic document retrieval, embeddings, vector search, AI summaries, action-item extraction, note-to-task conversion) · Notes System with real-time collaboration · Tasks & Action Items · AI Insights Engine · Workspace Management · Analytics Dashboard · Activity Tracking · Document Processing Pipeline · Calendar (FullCalendar) · Admin & Billing (Stripe). • Architecture: Designed a Modular Monolith + Intelligence Microservice architecture: Node.js/Express core handling auth, REST routes, WebSocket, and job orchestration, with a FastAPI Python sidecar (uvicorn, port 8000) owning all CPU-bound embedding and semantic inference — communicating via internal HTTP, sharing a single PostgreSQL/pgvector source of truth. • RAG Pipeline: Built a full RAG pipeline: document ingestion  text extraction  chunking  BGE-base-576M embedding generation (Sentence-Transformers, Python)  pgvector HNSW index storage  hybrid semantic + keyword retrieval — serving the /api/search/semantic endpoint. • Async Processing: Designed a dual async processing system: BullMQ/Redis event-driven worker (aiWorker.ts) handling AI jobs (generate-embedding, note-summary, note-action-items, note-to-tasks, file-process, email dispatch) and a DB polling queue (SELECT FOR UPDATE SKIP LOCKED, 2s interval) for transactional jobs — decoupling all heavy processing from API response latency. • LLM Routing: Integrated multi-provider LLM routing via OpenRouter API (cloud — GPT-4, Gemini, and others), Gemini API, and local Qwen 2.5 Instruct (offline mode) behind a unified AIProvider abstraction layer — enabling model switching, cost- aware routing, and fallback logic without changes to business logic. • Auth & RBAC: Implemented JWT authentication with a 3-layer RBAC system: authMiddleware.ts (GoTrue token validation), workspaceMiddleware.ts (membership scoping), and projectMiddleware.ts (project-level isolation) — enforced via roleMiddleware.ts and permissionMiddleware.ts on all protected API surfaces. • Real-Time: Built real-time collaboration using Socket.IO 4 across two namespaces (/collab, /notes) backed by Redis pub/sub for multi-process event broadcasting — supporting concurrent document editing and live notification dispatch. • Observability: Configured full production observability: Sentry (@sentry/node) for error telemetry, Prometheus (prom- client, /metrics endpoint) for runtime metrics, and Pino structured HTTP logging — giving the system complete crash and performance visibility. • CI/CD & Deployment: Deployed via a 4-pipeline GitHub Actions system: PR CI (Node 18/20 matrix, unit + integration tests), Staging CD (pg_dump DB backup + migrations + smoke tests + auto-rollback), Prod CD (Docker build + push to GHCR), and Terraform IaC pipeline — running against a Docker Compose stack (Node server, Redis 7, Python service). • Database & Testing: Designed a 44-migration PostgreSQL schema (raw pg driver, no ORM) with multi-tenant workspace isolation, Supabase RLS policies, soft-delete, and full audit logging — supported by 30 backend test files (Jest 29 + Supertest) covering auth, queue, semantic search, WebSocket, and AI service layers; 6 frontend test files (Vitest + Testing Library). Stack: React 18, Vite 7, TypeScript, Node.js 20, Express 4, FastAPI, Python 3.14, PostgreSQL, Supabase, Redis 7, BullMQ 5, pgvector, Socket.IO 4, OpenRouter, Gemini API, Qwen 2.5 Instruct, BGE-base-576M, Sentence-Transformers, Docker, GitHub Actions, Terraform, Sentry, Prometheus, Pino, Zod, TanStack Query, shadcn/ui, Framer Motion, Tiptap, FullCalendar, Stripe Smart Parking Management System 2025 github.com/saralbanker/smart-parking • Built a real-time parking occupancy system with live slot status broadcasting, online slot booking, reservation management, and an admin capacity dashboard. • Designed optimistic concurrency control for simultaneous check-in/check-out requests, preventing double-booking under concurrent load."
