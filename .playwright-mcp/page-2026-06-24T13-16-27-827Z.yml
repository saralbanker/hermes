                        - generic [ref=f6e50]: "Stack: React, Node.js, Express, Supabase, Tailwind CSS, TypeScript, WebSocket Carbon Compass 2025 github.com/saralbanker/carbon-compass • Designed a personal emissions tracking platform with activity logging across transport, energy, and food categories, an emissions modelling engine, and a time-series sustainability reporting dashboard. Stack: React, TypeScript, Vite, Tailwind CSS, shadcn/ui, Chart.js Employee Management System 2024 • Built a full HR management system for employee tracking, workforce administration, department management, and attendance records. Stack: HTML, CSS, JavaScript, MySQL Home Service Platform 2025 • Developed an Android application for home service booking, customer management, and appointment scheduling with a service provider matching flow. Stack: Kotlin, XML, SQLite (Android) Tax Calculator System 2024 • Built a GST and income tax computation tool with multi-slab logic and financial summary output. Stack: Java, React Steam Boiler Company Website 2024 • Redesigned and modernised a steam boiler company's corporate web presence, delivering a clean responsive site to replace an outdated static HTML page. Stack: HTML, CSS, JavaScript ADDITIONAL EXPERIENCE & CAPABILITIES – AI Model Evaluation — hands-on comparative evaluation of GPT-4, Claude (Anthropic), Gemini, DeepSeek, Qwen, Kimi, Gemma, and MiniMax across reasoning, code generation, and instruction-following tasks. – Prompt Engineering Systems — design and iteration of system prompts, few-shot examples, chain-of-thought frameworks, and custom prompt generation pipelines for production AI features. – Software Requirements Engineering — authored Product Requirement Documents (PRDs), system design specifications, and technical documentation across multiple projects. – Knowledge System Design — designed domain ontologies, chunking strategies, retrieval evaluation frameworks, and document workflow pipelines for AI-powered knowledge platforms. – Workflow Automation Design — designed semi-automated billing, notification, and document processing workflows replacing fully manual operational processes. – Cisco Packet Tracer — designed and simulated WLAN network topologies for academic infrastructure planning project. – AI-Assisted Development Workflows — integrated AI coding assistants into development workflow for code review, architecture validation, and documentation generation. EDUCATION Diploma in Computer Engineering LJ Polytechnic, Ahmadabad May 2026 CGPA 8.36 / 10 · Top 10% of class CERTIFICATIONS IBM Python for Data Science, AI & Development · Generative AI: Prompt Engineering Basics · Getting Started with Git and GitHub Google Foundations of Cybersecurity · Agile Project Management"
