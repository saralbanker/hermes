              - generic [ref=e120]:
                - text: Sprinto is an Autonomous Trust Platform that centralizes trust requirements across security frameworks, vendors, and customers.
                - text: Sprinto autonomously executes tasks needed to maintain trust across compliance, audits, risk management, vendor risk, privacy, and AI governance, enabling organizations to maintain a strong, reliable trust posture without draining operational bandwidth and resources on repetitive tasks.
                - text: Backed by top-tier investors such as Accel, Elevation, and Blume Ventures, we’ve raised $31.8M in funding to fuel our mission. Trusted by over 3,000 organizations across 75 countries, Sprinto helps organizations stay audit-ready, manage real-time risks, and scale fearlessly. With 300+ native integrations and AI-driven automation, Sprinto supports 200+ global security standards natively, including SOC 2, ISO 27001, GDPR, HIPAA, PCI-DSS, and more. Sprinto's extensible architecture enables organizations to build and support an infinite number of custom integrations and frameworks.
                - text: Founded in 2020 by second-time founders Girish Redekar and Raghuveer Kancherla, Sprinto powers compliance for organizations like Whatfix, Encora, Anaconda, Whatnot, Ultrahuman, WeWork, Everstage, AI Foundation, HackerRank, and many more.
              - generic [ref=e121]: "Your Mission:"
              - generic [ref=e122]: Be the technical champion behind Sprinto’s exceptional customer experience. You’ll solve challenging technical issues, support seamless integrations and APIs, and directly impact customer success every day.
              - heading "What does a typical day look like?" [level=3] [ref=e123]
              - list [ref=e124]:
                - listitem [ref=e125]: Provide fast, effective customer support across chat, email, Slack, and video (24x7).
                - listitem [ref=e126]: Deliver clear, helpful solutions-troubleshooting integrations, APIs, and cloud infrastructure issues.
                - listitem [ref=e127]: Proactively identify emerging trends, escalate crucial feedback, and improve documentation.
                - listitem [ref=e128]: Stay on the cutting-edge of product developments and security compliance.
                - listitem [ref=e129]: Swiftly recognise and manage critical outages, collaborating closely with engineering and leadership teams.
              - heading "What would make you a good fit for this role?" [level=3] [ref=e130]
              - list [ref=e131]:
                - listitem [ref=e132]: 2-4 years of customer or technical support experience.
                - listitem [ref=e133]: Skilled communicator (verbal and written) with proven technical troubleshooting abilities.
                - listitem [ref=e134]: Hands-on experience with Cloud platforms, API integrations, and change management tools is preferred.
                - listitem [ref=e135]: Calm under pressure, empathetic, patient, and customer-focused.
                - listitem [ref=e136]: Familiarity with Freshdesk is a bonus.
              - heading "Benefits at Sprinto" [level=3] [ref=e137]
              - list [ref=e138]:
                - listitem [ref=e139]: Remote First Policy
                - listitem [ref=e140]: 5 Days Working With FLEXI Hours
                - listitem [ref=e141]: Group Medical Insurance (Parents, Spouse, Children)
                - listitem [ref=e142]: Group Accident Cover
                - listitem [ref=e143]: Company Sponsored Device
                - listitem [ref=e144]: New Skill Development Policy
              - paragraph [ref=e145]: We may use artificial intelligence (AI) tools to support parts of the hiring process, such as reviewing applications, analyzing resumes, or assessing responses and identifying potential inconsistencies or verification signals in application materials based on available information. These tools assist our recruitment team but do not replace human judgment. Final hiring decisions are ultimately made by humans. If you would like more information about how your data is processed, please contact us.
