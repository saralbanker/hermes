            - heading "Full job description" [level=2] [ref=e137]
            - generic [ref=e138]:
              - paragraph [ref=e139]: About the role
              - paragraph [ref=e140]: You own the data and the truth about how our agents perform. You turn raw call data into reports, dashboards, and evaluations that clients and the internal team rely on — and you run the evals that tell us whether an agent is genuinely good, not just live. When a client asks "is this working?", your numbers answer the question.
              - paragraph [ref=e141]: What you'll own
              - paragraph [ref=e142]: Data & reporting
              - list [ref=e143]:
                - listitem [ref=e144]: Pull, clean, and structure call and agent data across platforms.
                - listitem [ref=e145]: Build and maintain the recurring reports clients receive — weekly QA summaries and performance reports.
                - listitem [ref=e146]: "Own data accuracy and definitions: what counts as containment, resolution, escalation, and so on, applied consistently across every account."
              - paragraph [ref=e147]: Analytics & dashboards
              - list [ref=e148]:
                - listitem [ref=e149]: Build and maintain dashboards — both internal and client-facing — covering agent performance, call volumes, and trends.
                - listitem [ref=e150]: "Surface the why, not just the what: where containment dropped, which intents misfire, where agents fail and why."
              - paragraph [ref=e151]: Evaluations (evals)
              - list [ref=e152]:
                - listitem [ref=e153]: Design and run evaluations on agent calls and outputs, scored against each agent's approved scope rather than a generic standard.
                - listitem [ref=e154]: Score transcripts, run weekly QA batches, and quantify blockers so they can be prioritized.
                - listitem [ref=e155]: Produce the client assurance summary that goes out with each reporting cycle.
              - paragraph [ref=e156]: Performance ownership
              - list [ref=e157]:
                - listitem [ref=e158]: "Own the measurement-side picture of agent performance and close the loop with the Conversational AI Engineer: you find the problem, they fix the agent, you confirm the fix landed."
                - listitem [ref=e159]: Maintain the QA workbook and per-agent evaluation packs.
              - paragraph [ref=e160]: What a strong first 90 days looks like
              - list [ref=e161]:
                - listitem [ref=e162]: You can independently produce a client-ready weekly performance and QA report.
                - listitem [ref=e163]: You've stood up or taken over at least one live dashboard.
                - listitem [ref=e164]: You can run an eval batch on a new agent and explain, in plain language, where it's strong and where it's failing.
              - paragraph [ref=e165]: Required
              - list [ref=e166]:
                - listitem [ref=e167]: "Strong data skills: SQL, advanced spreadsheets (Excel or Google Sheets), and comfort manipulating and reconciling data."
                - listitem [ref=e168]: Hands-on dashboard / BI experience (Looker, Power BI, Metabase, or similar).
                - listitem [ref=e169]: Analytical rigor — you care about definitions and accuracy, and you don't ship numbers you can't defend.
                - listitem [ref=e170]: A clear communicator who can write a summary a client trusts.
              - paragraph [ref=e171]: Nice to have
              - list [ref=e172]:
                - listitem [ref=e173]: Python (pandas) for data work.
                - listitem [ref=e174]: Experience evaluating LLM or AI outputs.
                - listitem [ref=e175]: Familiarity with conversation analytics or contact-center reporting.
                - listitem [ref=e176]: Exposure to Postgres and data pipelines.
              - paragraph [ref=e177]: Tools you'll work with
              - paragraph [ref=e178]: SQL / Postgres · Excel / Google Sheets · a BI tool · Python · VerSight and the QA workbook · call-platform data exports.
              - paragraph [ref=e179]: Reporting line
              - paragraph [ref=e180]: Reports to the BI / Data & Delivery lead.
