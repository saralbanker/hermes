              - list [ref=e83]:
                - listitem [ref=e84]: Experience with infrastructure and reliability at a scaling startup
                - listitem [ref=e85]: Experience with AI/ML systems in production
                - listitem [ref=e86]: Founder or co-founder experience, even if it didn't work out
