            - generic [ref=e50]:
              - paragraph [ref=e51]:
                - strong [ref=e52]: Company
              - paragraph [ref=e53]: Cassidy is an AI agent and automation platform for non-technical knowledge workers. By connecting to a company's knowledge where it lives and building intuitive core primitives, Cassidy lets non-technical teams automate large swaths of busy work, freeing them up to do the work that really matters.
              - paragraph [ref=e54]
              - paragraph [ref=e55]:
                - strong [ref=e56]: About the role
              - paragraph [ref=e57]: "We have 5 engineers and no product managers. Engineers own product decisions, work directly with customers, and ship daily. We're looking for someone who can be the first among equals on the engineering team: the person who takes on the hard architectural decisions, owns system reliability as we scale enterprise customers, and raises the bar for the whole team."
              - paragraph [ref=e58]
              - paragraph [ref=e59]: "You'll work across the full stack building the core platform: agents, workflows, knowledge bases, and integrations. The work right now is a mix of complex product engineering (building agentic harnesses that can scale, workflow orchestration, enterprise permissioning systems), platform reliability as we onboard larger customers, and applied AI engineering that's genuinely cutting edge."
              - paragraph [ref=e60]
              - paragraph [ref=e61]:
                - strong [ref=e62]: What You’ll Do
              - list [ref=e63]:
                - listitem [ref=e64]: "Own core systems end to end: design, build, ship, and keep them running"
                - listitem [ref=e65]: Be the senior technical voice in the room on architecture and tradeoff decisions
                - listitem [ref=e66]: Improve platform reliability and scalability. We're growing fast and need someone who's owned production systems under real load before.
                - listitem [ref=e67]: Make product decisions. Engineers here decide what to build, not just how.
                - listitem [ref=e68]: "Work on applied AI engineering: LLM orchestration, agent systems, tool calling. This stuff changes monthly and we're building at the frontier."
              - paragraph [ref=e69]
              - paragraph [ref=e70]:
                - strong [ref=e71]: Who You Are
              - list [ref=e72]:
                - listitem [ref=e73]: "Full stack experience (we're end to end TypeScript: Node, React, Postgres)"
                - listitem [ref=e74]: You've been at 2-3+ companies and this isn't your first startup. Ideally you were early at a company at least once.
                - listitem [ref=e75]: You've owned complex systems over time and have seen what happens when architectural decisions play out over years, not weeks
                - listitem [ref=e76]: You have strong product instincts. You think about what to build, not just how.
                - listitem [ref=e77]: You can own something end to end without needing someone to break it down for you
                - listitem [ref=e78]: "You're motivated by impact: applying what you know to build something real, not just chasing the most technically interesting problem"
                - listitem [ref=e79]: CS degree or equivalent
              - paragraph [ref=e80]
              - paragraph [ref=e81]:
