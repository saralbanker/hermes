                                - generic [ref=e132]: "Saral Banker Full Stack Engineer · AI Application Developer · Founding Engineer Candidate Ahmedabad, Gujarat, India · saralbanker1@gmail.com · +91 9016990136 github.com/saralbanker orvion-co.Vercel.app PROFESSIONAL SUMMARY Full Stack and AI Application Engineer who architects and ships complete, production-grade systems — from PostgreSQL schema and REST API design through to React frontend and containerised deployment. Independently designed and built Neuro-Zenith (NeuroDashboard): a 70k+ LOC modular AI productivity platform spanning a full RAG pipeline, Socket.IO real-time collaboration, async job processing (BullMQ/Redis), multi-provider LLM routing (OpenRouter, Gemini, local Qwen 2.5 Instruct), RBAC auth, Sentry error tracking, Prometheus metrics, and a 4-pipeline GitHub Actions CI/CD system. Delivered a second production system as a paid contract — a financial operations platform that replaced manual Excel billing and physical collection calls for a 220-unit rental business, enforcing automated late-fee penalties and saving an estimated 40+ hours per monthly billing cycle. Experienced in AI model evaluation across GPT-4, Claude, Gemini, DeepSeek, Qwen, Kimi, Gemma, and MiniMax. At my best with hard problems, full ownership, and the autonomy to ship. TECHNICAL SKILLS Languages TypeScript, JavaScript, Python, SQL, Java, Kotlin, HTML, CSS Frontend React 18, Next.js, Vite, Tailwind CSS, shadcn/ui, Radix UI, Framer Motion, TanStack React Query, Zustand, Tiptap, Recharts, FullCalendar Backend Node.js, Express 4, FastAPI, REST API Design, Socket.IO 4, SSE AI & LLMs RAG Pipelines · pgvector (HNSW) · Semantic Search · BGE-base-576M Embeddings (Sentence-Transformers) · OpenRouter API · Gemini API · Local LLM Inference (Qwen 2.5 Instruct) · Prompt Engineering · Structured Output Parsing (Zod) · AI Workflow Automation · Multi-Provider LLM Integration · AI Model Evaluation (GPT-4, Claude, Gemini, DeepSeek, Qwen, Kimi, Gemma, MiniMax) Databases PostgreSQL (raw pg driver, 44 migrations), Supabase, Redis 7, MySQL, SQLite, pgvector Infrastructure Docker, Docker Compose, GitHub Actions (CI + Staging CD + Prod CD + Terraform IaC), GHCR, Terraform, Supabase CLI Architecture Modular Monolith + Intelligence Microservice · BullMQ Async Job Processing · DB Polling Queue (SKIP LOCKED) · Event-Driven (Redis Pub/Sub) · Multi-Tenant RBAC · JWT Auth · Rate Limiting · Audit Logging · Software Requirements Engineering · PRD Writing · System Architecture Design Observability Sentry (@sentry/node), Prometheus (prom-client), Pino structured logging Mobile Kotlin, XML, SQLite (Android) Tools Zod, Vitest, Jest 29, Supertest, Postman, Git, Cisco Packet Tracer EXPERIENCE Contract Full Stack Engineer Jan 2025 – Mar 2026 Financial Operations Platform (Shade Ledger) · Confidential Client · Ahmedabad, Gujarat • Owned the complete project lifecycle for a rental property financial operations platform serving 220 units — replaced a workflow where the client manually entered data in Excel and physically called each of 220 vendors every month, with no enforceable penalty for late fees due to face-to-face relationship dependency. • Built a recurring billing engine with automated PDF invoice generation (react-pdf), WhatsApp Business API direct delivery, and structured late-fee penalty logic — eliminating ad-hoc fee waivers and recovering previously lost penalty revenue on every billing cycle. • Engineered a bulk Excel import pipeline with row-level schema validation and error reporting, reducing monthly tenant data entry from a multi-hour manual process to a single structured file upload. • Built a maintenance management module for tracking repair requests, vendor assignments, and resolution status across all 220 units. • Designed an immutable financial audit log capturing all mutations (payments, voids, penalty charges, adjustments) with actor identity, timestamp, and before/after state — replacing informal verbal agreements with a traceable, queryable system of record."
