            - generic [ref=e254]:
              - heading [level=3] [ref=e583]:
                - generic [ref=e258]: Share links/examples of dashboards you have built.
                - generic [ref=e584]: "*"
              - textbox [ref=e585]: "Portfolio: https://orvion-co.vercel.app | GitHub: https://github.com/saralbanker Built the full admin dashboard for Neuro-Zenith (70k+ LOC AI productivity platform) using React, TypeScript, and recharts — visualizing real-time agent performance, call metrics, task throughput, and pipeline health across 400+ source files. Data layer backed by PostgreSQL with 44 migrations. Also built reporting views in Shade Ledger (financial operations platform) showing rental income trends and ledger analytics."
          - listitem [ref=e266]:
            - generic [ref=e268]:
              - heading [level=3] [ref=e586]:
                - generic [ref=e272]: Explain how you would identify why a KPI suddenly dropped.
                - generic [ref=e587]: "*"
              - textbox [ref=e588]: "I follow a structured decomposition approach: 1. Isolate the time window — confirm the drop is real vs. a data pipeline lag or missing data issue. 2. Segment the metric — break it down by agent, channel, intent type, or client to find which segment drove the drop. 3. Check upstream inputs — did call volume change? Did a new agent go live? Was there a deployment? Look at recent changes in the system. 4. Drill into transcripts or raw events — sample failing cases to identify the actual failure pattern (misrouted intents, escalations spiking, etc.). 5. Cross-reference with related KPIs — e.g., if containment dropped, did handle time or escalation rate change in tandem? 6. Hypothesize, then validate — form a root cause hypothesis and test it against the data before reporting. 7. Communicate the finding with supporting data and a remediation recommendation."
          - listitem [ref=e280]:
            - generic [ref=e282]:
              - heading [level=3] [ref=e589]:
