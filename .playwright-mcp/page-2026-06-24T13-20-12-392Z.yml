          - listitem [ref=e306]:
            - generic [ref=e308]:
              - heading [level=3] [ref=e594]:
                - generic [ref=e312]: If yes, describe your QA process.
                - generic [ref=e595]: "*"
              - textbox [ref=e596]: "For Neuro-Zenith, I implemented a multi-layer QA process: 1. Automated test pipelines: 4-stage GitHub Actions CI/CD with lint, type-check, unit tests, and integration tests against a real PostgreSQL instance. 2. Data validation: Pre-commit hooks and schema validation on all database migrations (44 migrations maintained with zero drift). 3. Transcript review: Weekly batch review of AI agent outputs against defined acceptance criteria — scored for accuracy, tone, and task completion. 4. Regression tracking: Maintained a QA workbook tracking each eval cycle, noting which issues were fixed and which recurred. 5. Eval scoring: Built structured rubrics per agent scope so scoring was consistent across reviewers and cycles."
          - listitem [ref=e320]:
            - generic [ref=e322]:
              - heading [level=3] [ref=e597]:
                - generic [ref=e326]: How would you evaluate whether an AI voice agent is performing well?
                - generic [ref=e598]: "*"
              - textbox [ref=e599]: "I evaluate AI voice agents on four dimensions: 1. Task completion / containment rate — did the agent resolve the caller's intent without escalating to a human? Measured per intent category. 2. Transcript quality — are responses accurate, on-scope, and appropriately concise? Scored against the agent's approved scope, not a generic benchmark. 3. Failure pattern analysis — where does the agent misfire? Which intents trigger fallbacks, misroutes, or escalations? Quantified and ranked by frequency and impact. 4. Client outcome metrics — are downstream outcomes (bookings, resolutions, etc.) improving or degrading? Tie agent performance to business KPIs. For each eval cycle I produce a summary: overall score, top 3 failure patterns, and specific fixes to hand off to the Conversational AI Engineer."
