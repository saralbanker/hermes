              - generic [ref=e126]:
                - paragraph [ref=e127]: About Command|Link
                - paragraph
                - paragraph [ref=e128]: Command|Link is a global SaaS Platform providing network, voice services, and IT security solutions, helping corporations consolidate their core infrastructure into a single vendor and layering on a proprietary single pane of glass platform. Command|Link has revolutionized the IT industry by tackling the problems our competitors create. In recognition for our unprecedented innovation and dedication, Command|Link was recognized as the SD-WAN Product of the Year, ITSM Visionary Spotlight, UCaaS Product of the Year, NaaS Product of the Year, Supplier of the Year, and the AT&T Strategic Growth Partner. Command|Link has built the only IT platform for scale that solves ISP vendor sprawl and IT headaches. We make it easy for our customers to get more done, maximize uptime and improve the bottom line.
                - paragraph
                - paragraph [ref=e129]: Learn more about us here!
                - paragraph
                - paragraph [ref=e130]:
                  - generic [ref=e131]: This is a 100% remote position
                - paragraph
                - paragraph [ref=e132]:
                  - generic [ref=e133]: "About your new role:"
                - paragraph [ref=e134]: "This role owns the security product at its highest level of accountability: the API and UI that transform ingested security telemetry into a coherent, investigable picture for analysts. As a Staff Engineer, you won't just build this surface; you'll define how it should work, set the architectural direction that shapes it, and ensure the teams and systems that feed into it are aligned to a common standard. You'll work across a broad range of security data sources and partner with alert, classification, and ingestion teams to establish the data contracts that determine how security signal flows across the platform. This is full-stack work with a strong security-domain emphasis, and it requires someone who can operate at the intersection of system design, domain depth, and cross-functional influence."
                - paragraph
                - paragraph [ref=e135]:
                  - generic [ref=e136]: "Key Responsibilities:"
                - list [ref=e137]:
                  - listitem [ref=e138]: Own the security service API and UI end-to-end, including architectural decisions, system design, and long-term roadmap direction.
                  - listitem [ref=e139]: Define and enforce the data contracts between security product teams and adjacent services, including alert, classification, and ingestion.
                  - listitem [ref=e140]: "Integrate and present a wide range of security telemetry: syslog, NetFlow, SNMP, firewall telemetry, OTel, EDR telemetry, and MDR ingest."
                  - listitem [ref=e141]: Make cloud environments and their audit trails first-class within the product.
                  - listitem [ref=e142]: Surface enriched entities, alerts, and topology in ways that map to how security teams actually investigate.
                  - listitem [ref=e143]: Drive architectural decisions across ambiguous problem spaces where requirements are incomplete or competing.
                  - listitem [ref=e144]: Establish technical patterns and standards that other engineers on the team can build against reliably.
                  - listitem [ref=e145]: Mentor and develop engineers across the security product team, raising the quality and consistency of output across the group.
                  - listitem [ref=e146]: Takes on additional responsibilities and projects as needed to support the success of the team and organization.
                - paragraph [ref=e147]: "What you'll need for success:"
                - paragraph [ref=e148]: "Required:"
                - list [ref=e149]:
                  - listitem [ref=e150]: Production experience with Kafka and OpenSearch in high-volume, latency-sensitive environments.
                  - listitem [ref=e151]: Deep familiarity with protobuf and contract-driven development at a multi-team scale.
                  - listitem [ref=e152]: Broad security telemetry experience across syslog, NetFlow, SNMP, firewall telemetry, OTel, EDR, and MDR ingest.
                  - listitem [ref=e153]: Strong working knowledge of cloud environments and audit trails.
                  - listitem [ref=e154]: Familiarity with a range of security products including NDR, XDR, and similar.
                  - listitem [ref=e155]: Demonstrated ability to reason across diverse data sources and derive usable network and system topologies from them.
                  - listitem [ref=e156]: Experience operating with significant autonomy across ambiguous, cross-functional problem spaces.
                  - listitem [ref=e157]: Proven track record of cross-team technical influence that drives alignment on architecture or standards beyond your immediate team.
                - paragraph [ref=e158]: "Nice to Have:"
                - list [ref=e159]:
                  - listitem [ref=e160]: Hands-on experience with Memgraph or other graph data platforms.
                  - listitem [ref=e161]: Familiarity with stream processing frameworks such as Flink.
                  - listitem [ref=e162]: Experience working with LLM-based reasoning systems or providing structured context to LLMs for troubleshooting and investigation workflows.
                  - listitem [ref=e163]: Prior work in security product companies or on security platforms with analyst-facing tooling.
                - paragraph
                - paragraph [ref=e164]:
                  - generic [ref=e165]: Why you'll love life at Command|Link
                - paragraph [ref=e166]: Join us at CommandLink, where you'll have the opportunity to shape the future of business communication. We value the innovative spirit and seek individuals ready to bring their unique vision and expertise to a team that values bold ideas and strategic thinking. Are you ready to make an impact?
                - paragraph
                - list [ref=e167]:
                  - listitem [ref=e168]: Room to grow at a high-growth company
                  - listitem [ref=e169]: An environment that celebrates ideas and innovation
                  - listitem [ref=e170]: Your work will have a tangible impact
                  - listitem [ref=e171]: Generous Medical, Dental, and Vision coverage for full-time employees
                  - listitem [ref=e172]: Flexible time off
                  - listitem [ref=e173]: 401k to help you save for the future
                  - listitem [ref=e174]: Fun events at cool locations
                  - listitem [ref=e175]: Free DoorDash lunches on Fridays
                  - listitem [ref=e176]: Employee referral bonuses to encourage the addition of great new people to the team
                - paragraph
                - paragraph [ref=e177]: Commandlink hires individuals in a number of geographic regions and the pay ranges listed reflect the cost of labor across these regions. The base pay for this position as displayed at the bottom of the job description is a range based on our lowest geographic region, up to our highest geographic region. Pay is based on location among other factors, such as skill-set, experience, and qualifications held.
                - paragraph
                - paragraph [ref=e178]: At CommandLink, we’re committed to creating a fair, consistent, and efficient hiring experience. As part of our process, we use AI-assisted tools to help review and analyze applications. These tools support our recruiting team by identifying qualifications and experience that align with the requirements of each role.
                - paragraph
                - paragraph [ref=e179]: AI tools are used only to assist in the evaluation process — they do not make final hiring decisions. Every application is reviewed by a member of our recruiting or hiring team before any decisions are made.
              - paragraph
