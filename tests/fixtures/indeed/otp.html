<!DOCTYPE html>
<html>
<head><title>Verify your identity - Indeed.com</title></head>
<body>
  <main>
    <h1>Enter the code we sent you</h1>
    <p>We've sent a 6-digit verification code to your email. Check your inbox and enter it below.</p>
    <form>
      <label for="otp">Verification code</label>
      <input type="text" id="otp" name="verificationCode" maxlength="6">
      <button type="submit">Verify</button>
    </form>
  </main>
</body>
</html>
