<!DOCTYPE html>
<html>
<head><title>Apply - Backend Engineer at Acme Corp | Indeed Apply</title></head>
<body>
  <div id="ia-container" class="ia-BasePage">
    <header class="ia-ContinueButtonWrapper">
      <h1>Contact info</h1>
    </header>
    <form class="ia-ApplyFormScreen">
      <label for="firstName">First name</label>
      <input type="text" id="firstName" name="firstName">
      <label for="lastName">Last name</label>
      <input type="text" id="lastName" name="lastName">
      <label for="resume">Resume</label>
      <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
      <button type="button" class="ia-continueButton">Continue to next step</button>
    </form>
  </div>
</body>
</html>
